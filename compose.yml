services:
  db:
    image: postgres:15

    networks:
      - backend

    environment:
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
    volumes:
    - db:/var/lib/postgresql/data
    - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
    - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


  app:
    build: app
    
    networks:
      - frontend
      - backend

    ports:
    - "5600:5600"

    depends_on:
      db:
        condition: service_healthy
        restart: true
    

  dashboard:
    image: grafana/grafana:latest
    ports:
    - "3000:3000"

    volumes:
    - grafana:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning
    
    networks:
      - frontend
      - backend

    depends_on:
      db:
        condition: service_healthy
  
networks:
  frontend:
    driver: bridge
  
  backend:
    driver: bridge

volumes:
  db:
  grafana:
